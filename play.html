<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NFTzWORLD YAP</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; width: min(100vw, 100vh); height: min(100vw, 100vh); touch-action: manipulation; }
    #case { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
    #clasp {
      position: absolute; left: 86%; top: 35%; width: 13%; height: 24%;
      background: transparent; border: 0; padding: 0; cursor: pointer;
    }
    #glass, #glass * { box-sizing: border-box; }
    #glass {
      position: absolute; left:24.1211%;top:15.9180%;right:25.1953%;bottom:25.7812%;
      display: flex; flex-direction: column; background: var(--bg, #050505);
      container-type: size; touch-action: manipulation; overflow: hidden;
      font-family: ui-monospace, Menlo, monospace; color: var(--ink, #fff);
    }
    #glass[data-case="loud"] {
      --bg: #12040c; --key: #2a1020; --key-hi: #4c1836; --key-edge: #ff2ea6;
      --ink: #fff7fb; --muted: #f0b4d4; --led-off: #3d1428; --led-on: #ccff00;
      --accent: #ccff00; --accent-ink: #14060d; --lcd-bg: #1c0714; --lcd-ink: #f3ffe4;
      --well: #0c0308;
    }
    #glass[data-case="graphite"] {
      --bg: #0c0e11; --key: #1b1e23; --key-hi: #32373f; --key-edge: #66707c;
      --ink: #f4f6f8; --muted: #b7bec8; --led-off: #2c281c; --led-on: #ffb020;
      --accent: #ffb020; --accent-ink: #1a1204; --lcd-bg: #12161c; --lcd-ink: #ffe6c2;
      --well: #08090b;
    }
    header, footer { flex: 0 0 auto; display: grid; align-items: center; gap: 1.3cqi; padding: 1.6cqi 1.8cqi 0; }
    header { grid-template-columns: auto auto 1fr auto auto; }
    footer { grid-template-columns: 1.15fr .7fr .95fr; padding: 0 1.8cqi 1.6cqi; }
    #mark { font: 800 4.6cqi/1 ui-monospace, Menlo, monospace; letter-spacing: .14em; color: var(--accent); }
    #codeLamp { width: 2.1cqi; height: 2.1cqi; border-radius: 50%; background: #241f18; justify-self: start; }
    #glass.coding #codeLamp { background: var(--led-on); box-shadow: 0 0 8px var(--led-on); }
    button { font: 700 2.9cqi/1 ui-monospace, Menlo, monospace; letter-spacing: .06em; color: var(--ink); background: var(--well); border: 1px solid var(--key-edge); border-radius: 1.1cqi; min-height: 7.4cqi; padding: 0 1.6cqi; cursor: pointer; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #armBtn[aria-pressed="true"], #spaceBtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    #cutBtn { color: #ff8aa0; }
    #lcd {
      flex: 0 0 auto; margin: 1.4cqi 1.8cqi; min-height: 15cqi;
      background: var(--lcd-bg); border-radius: 1.2cqi; padding: 1.2cqi 2cqi;
      display: flex; flex-direction: column; justify-content: center; gap: .5cqi;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), inset 0 10px 16px rgba(0,0,0,.45);
      overflow: hidden;
    }
    #lcdKicker { font: 700 2.3cqi/1 ui-monospace, Menlo, monospace; letter-spacing: .16em; color: var(--accent); font-style: normal; }
    #lcdText {
      font: 650 3.9cqi/1.25 ui-monospace, Menlo, monospace; color: var(--lcd-ink);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    #keys {
      flex: 1 1 auto; min-height: 0;
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
      gap: 1.3cqi; padding: 0 1.8cqi 1.3cqi;
    }
    .key {
      min-width: 0; min-height: 0; padding: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25cqi;
      background: linear-gradient(180deg, var(--key-hi), var(--key));
      border: 1px solid var(--key-edge); border-radius: 1.3cqi; color: var(--ink);
    }
    .key b { font: 800 3.5cqi/1 ui-monospace, Menlo, monospace; letter-spacing: .04em; }
    .key small { font: 600 2cqi/1 ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: .08em; }
    .led { width: 2cqi; height: 2cqi; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 0 0 1px rgba(0,0,0,.55); }
    .key:active .led, .key.hot .led, .key.held .led { background: var(--led-on); box-shadow: 0 0 8px var(--led-on); }
    .key.miss .led { background: #ff3355; box-shadow: 0 0 8px #ff3355; }
    #glass.egg .led { background: var(--led-on); box-shadow: 0 0 10px var(--led-on); animation: yapblink .16s steps(2) infinite; }
    @keyframes yapblink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      #glass.egg .led { animation: none; }
      button:active, .key:active { transform: none; }
    }
  </style>
</head>

    function load() {
      try {
        const raw = localStorage.getItem(STORE);

      } catch (e) {

    function same(a, b) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }
    function isPrefix(seq, buf) {
      if (seq.length < buf.length) return false;
      for (let i = 0; i < buf.length; i++) if (seq[i] !== buf[i]) return false;
      return true;
    }
    function feed(index) {
      const had = buffer.length > 0;
      const nxt = buffer.concat([index]);
      for (let n = 0; n < EGGS.length; n++) {
        if (same(nxt, EGGS[n].seq)) {
          buffer = [];
          return { egg: EGGS[n], broke: false };
        }
      }
      for (let n = 0; n < EGGS.length; n++) {
        if (isPrefix(EGGS[n].seq, nxt)) {
          buffer = nxt;
          return { egg: null, broke: false };
        }
      }
      const restarted = [index];
      for (let n = 0; n < EGGS.length; n++) {
        if (isPrefix(EGGS[n].seq, restarted)) {

          return { egg: null, broke: false };

    function makeUtterance(text, name) {

      u.volume = 1;
      return u;

      return u;

    function wake() {

      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";

      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    }

        return;
      }
      const my = ++talkToken;
      const busy = !!(synth.speaking || synth.pending);
      if (busy) {
        try { synth.cancel(); } catch (e) {}
      }
      try { synth.resume(); } catch (e) {}
      let settled = false;
      const speak = (u) => {
        alive = u;
        u.onstart = () => { settled = true; };
        u.onerror = (ev) => {
          if (my !== talkToken || settled) return;
          const err = (ev && ev.error) || "";
          if (err === "interrupted" || err === "canceled" || err === "cancelled") {
            settled = true;
            return;
          }
          settled = true;
          const bare = bareUtterance(text);
          alive = bare;
          bare.onerror = (ev2) => {
            if (my !== talkToken) return;
            const why = (ev2 && ev2.error) || err || "voice failed";
            const framed = window.top !== window.self;
            show("NO VOICE", framed ? "This frame blocked the voice. Open the player alone." : why);
          };
          try { synth.resume(); synth.speak(bare); } catch (e) {}
        };
        try { synth.speak(u); } catch (e) {}
      };
      speak(makeUtterance(text, name));
      window.setTimeout(() => {
        if (my !== talkToken || settled) return;
        if (synth.speaking || synth.pending) return;
        settled = true;
        const again = bareUtterance(text);
        alive = again;
        try { synth.resume(); synth.speak(again); } catch (e) {}
      }, busy ? 70 : 180);
    }
    function cut() {
      talkToken += 1;
      if (window.speechSynthesis) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      show("CUT", "Clip stopped.");
      pokeIdle();
    }
    function paintVoice() {
      voiceBtn.textContent = voiceName.toUpperCase();
      voiceBtn.setAttribute("aria-label", "Voice " + voiceName + ". Tap for the next voice.");
    }
    function paintArm() {
      armBtn.setAttribute("aria-pressed", armed ? "true" : "false");
      armBtn.textContent = armed ? "ARMED" : "ARM";
      glass.classList.toggle("armed", armed);
    }
    function paintSpace() {
      spaceBtn.setAttribute("aria-pressed", spaceOn ? "true" : "false");
      spaceBtn.textContent = spaceOn ? "IN SPACE" : "SPACE";
      const note = spaceOn
        ? "In the Space, set the mic to this Mac output. BlackHole or Loopback."
        : "Desk. Turn Space on when the room should hear the clip.";
      spaceBtn.setAttribute("aria-label", note);
    }
    function setCase(name) {
      caseName = name === "graphite" ? "graphite" : "loud";
      glass.setAttribute("data-case", caseName);
      caseEl.src = caseName === "graphite" ? metalUri : loudUri;
      const label = caseName === "graphite" ? "GRAPHITE" : "LOUD";
      caseBtn.textContent = label;
      caseBtn.setAttribute("aria-label", "Case is " + label.toLowerCase() + ". Tap to switch.");
      save();
    }
    function toggleCase() {
      setCase(caseName === "loud" ? "graphite" : "loud");
      show(caseName === "loud" ? "LOUD" : "GRAPHITE", caseName === "loud" ? "Custom paint. Same sixteen keys." : "Graphite shell. Same sixteen keys.");
      pokeIdle();
    }
    function toggleArm() {
      heard = true;
      armed = !armed;
      paintArm();
      if (!armed) {
        talkToken += 1;
        if (window.speechSynthesis) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        show("MUTED", "Muted. Tap ARM to hear the keys.");
      } else {
        show("ARMED", spaceOn ? "Armed. A Space hears this Mac output." : "Armed. Tap a key.");
        talk("Armed.", voiceName);
      }
      pokeIdle();
    }
    function toggleSpace() {
      spaceOn = !spaceOn;
      paintSpace();
      if (spaceOn) show("IN SPACE", "Point the Space mic at this Mac output. BlackHole or Loopback.");
      else show("DESK", "Desk mode. Arm, then tap.");
      pokeIdle();
    }
    function cycleVoice() {
      const i = VOICES.indexOf(voiceName);
      voiceName = VOICES[(i + 1) % VOICES.length];
      save();
      paintVoice();
      show("VOICE", voiceName);
      if (armed) talk(voiceName + ".", voiceName);
      pokeIdle();
    }
    function flash(i) {
      const el = buttons[i];
      el.classList.add("hot");
      window.setTimeout(() => el.classList.remove("hot"), 240);
    }
    function miss(i) {
      const el = buttons[i];
      el.classList.add("miss");
      window.setTimeout(() => el.classList.remove("miss"), 200);
    }
    function celebrate() {
      glass.classList.add("egg");
      window.clearTimeout(eggTimer);
      eggTimer = window.setTimeout(() => glass.classList.remove("egg"), 2800);
    }
    function idleLine() {
      const rows = [
        ["YAP", armed ? "Armed. Tap a key." : "Tap a key. Sound follows the key."],
        ["ORDER", "Order is a key."],
        ["KEYS", "1 2 3 4    q w e r    a s d f    z x c v"],
        ["CUT", "Cut stops the clip."],
        ["SPACE", spaceOn ? "Point the Space mic at this Mac output." : "Space mode is how a room hears the clip."]
      ];
      return rows[idleN % rows.length];
    }
    function startIdle() {
      if (buffer.length || glass.classList.contains("egg")) {
        idleTimer = window.setTimeout(startIdle, 1000);
        return;
      }
      const row = idleLine();
      show(row[0], row[1]);
      idleN += 1;
      idleTimer = window.setTimeout(startIdle, 3200);
    }
    function pokeIdle() {
      window.clearTimeout(idleTimer);
      idleTimer = window.setTimeout(startIdle, 4500);
    }
    function press(i) {
      flash(i);
      if (!heard) {
        heard = true;
        armed = true;
        paintArm();
      }
      const result = feed(i);
      armHold();
      if (result.egg) {
        show(result.egg.name, result.egg.show);
        talk(result.egg.say, result.egg.voice);
        celebrate();
      } else {
        show(armed ? "SAYS" : "MUTED", KEYS[i].show);
        talk(KEYS[i].say, voiceName);
        if (result.broke) miss(i);
      }
      pokeIdle();
    }

    let cells = "";
    for (let i = 0; i < KEYS.length; i++) {
      const k = KEYS[i];
      keymap[k.key] = i;
      cells += '<button type="button" class="key" id="k' + i + '" data-i="' + i + '" aria-label="' + k.code + ". " + k.show + '" aria-keyshortcuts="' + k.key + '"><i class="led" aria-hidden="true"></i><b>' + k.code + '</b><small>' + k.key + '</small></button>';
    }
    keysEl.innerHTML = cells;
    for (let i = 0; i < KEYS.length; i++) buttons.push(document.getElementById("k" + i));
    keysEl.addEventListener("click", (ev) => {
      const el = ev.target.closest("button");
      if (!el || el.dataset.i == null) return;
      press(el.dataset.i | 0);
    });
    caseBtn.addEventListener("click", toggleCase);
    clasp.addEventListener("click", toggleCase);
    armBtn.addEventListener("click", toggleArm);
    cutBtn.addEventListener("click", cut);
    voiceBtn.addEventListener("click", cycleVoice);
    spaceBtn.addEventListener("click", toggleSpace);
    holdBtn.addEventListener("click", () => {
      show("CODE", buffer.length ? "Code is " + buffer.length + " long. Order is a key." : "Order is a key.");
      pokeIdle();
    });
    window.addEventListener("keydown", (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey || ev.repeat) return;
      const k = ev.key.toLowerCase();
      if (k === "escape" || k === " ") {
        ev.preventDefault();
        cut();
        return;
      }
      if (Object.prototype.hasOwnProperty.call(keymap, k)) {
        ev.preventDefault();
        press(keymap[k]);
      }
    });
    const saved = load();
    if (VOICES.indexOf(saved.voice) !== -1) voiceName = saved.voice;
    setCase(saved.case === "graphite" ? "graphite" : "loud");
    paintVoice();
    paintArm();
    paintSpace();
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener("voiceschanged", paintVoice);
    }
    startIdle();
  })();
  </script>
</body>
</html>
